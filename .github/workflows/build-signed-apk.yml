name: Build Signed APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build Flavor"
        required: true
        default: "oss"
        type: choice
        options:
          - "oss"
          - "preview"
      save_keystore:
        description: "Upload Keystore as Artifact (for app updates)"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Setup Android NDK & SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -name "25.*" 2>/dev/null | head -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -type d 2>/dev/null | tail -n 1)
          fi
          echo "ndk.dir=${NDK_PATH}" >> local.properties
          echo "Using NDK: ${NDK_PATH}"

      - name: LibCore Status Check
        run: |
          find buildScript libcore/*.sh -type f 2>/dev/null | xargs cat 2>/dev/null | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: Cache LibCore Native AAR
        id: cache-libcore
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Build LibCore Native Core
        if: steps.cache-libcore.outputs.cache-hit != 'true'
        run: |
          ./run lib core

      - name: Restore Signing Keystore Cache
        id: cache-signing-keystore
        uses: actions/cache@v4
        with:
          path: .signing_cache
          key: tsukimibox-signing-keystore-v1

      - name: Setup Signing Keystore
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          SECRET_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "=== Setting up Signing Keystore ==="
          mkdir -p .signing_cache keystore_backup

          LEGACY_HASH="c49f0d17b35b8e6620a20eced4b8a14274a3050592543e6a67aa7cc52bca1599"
          if [ -f release.keystore ]; then
            CURRENT_HASH=$(sha256sum release.keystore | awk '{print $1}')
            if [ "$CURRENT_HASH" = "$LEGACY_HASH" ]; then
              echo "Detected legacy upstream keystore with unknown password, removing..."
              rm -f release.keystore
            fi
          fi

          DEFAULT_KEYSTORE_PASS="tsukimibox_release_2026"
          DEFAULT_ALIAS_NAME="tsukimibox"
          DEFAULT_ALIAS_PASS="tsukimibox_release_2026"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Priority 1: Restoring keystore from GitHub Secrets..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          elif [ -f .signing_cache/release.keystore ]; then
            echo "Priority 2: Restoring persistent keystore from Actions Cache..."
            cp .signing_cache/release.keystore release.keystore
            if [ -f .signing_cache/credentials.env ]; then
              source .signing_cache/credentials.env
            else
              KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
              ALIAS_NAME="$DEFAULT_ALIAS_NAME"
              ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            fi
          elif [ -f release.keystore ]; then
            echo "Priority 3: Using pre-existing release.keystore in workspace..."
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          else
            echo "Priority 4: Generating persistent baseline release.keystore..."
            KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
            ALIAS_NAME="$DEFAULT_ALIAS_NAME"
            ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${ALIAS_NAME}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASS}" \
              -keypass "${ALIAS_PASS}" \
              -dname "CN=TsukimiBox, OU=Release, O=TsukimiBox, L=Tokyo, ST=Tokyo, C=JP"
          fi

          # Synchronize active keystore and credentials to cache
          cp release.keystore .signing_cache/release.keystore
          {
            echo "KEYSTORE_PASS=${KEYSTORE_PASS}"
            echo "ALIAS_NAME=${ALIAS_NAME}"
            echo "ALIAS_PASS=${ALIAS_PASS}"
          } > .signing_cache/credentials.env

          # Populate local.properties and environment variables for Gradle
          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> local.properties
          echo "ALIAS_NAME=${ALIAS_NAME}" >> local.properties
          echo "ALIAS_PASS=${ALIAS_PASS}" >> local.properties

          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "ALIAS_NAME=${ALIAS_NAME}" >> $GITHUB_ENV
          echo "ALIAS_PASS=${ALIAS_PASS}" >> $GITHUB_ENV

          # Prepare keystore backup artifact and base64 export
          cp release.keystore keystore_backup/
          base64 -w 0 release.keystore > keystore_backup/keystore_base64.txt
          {
            echo "Keystore File: release.keystore"
            echo "Alias: ${ALIAS_NAME}"
            echo "Keystore Password: ${KEYSTORE_PASS}"
            echo "Key Password: ${ALIAS_PASS}"
            echo ""
            echo "================================================================================"
            echo "Notice: To permanently fix signatures across all CI runners and clean caches:"
            echo "1. Copy the content of 'keystore_base64.txt' into GitHub Repository Secret 'KEYSTORE_BASE64'."
            echo "2. Add 'KEYSTORE_PASS', 'ALIAS_NAME', and 'ALIAS_PASS' to Secrets if customized."
            echo "================================================================================"
          } > keystore_backup/credentials.txt
          echo "Signing Keystore configuration completed successfully."

      - name: Prepare Assets (GeoIP / GeoSite)
        run: |
          ./run init action gradle

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Build Signed APK
        env:
          BUILD_PLUGIN: none
        run: |
          FLAVOR="${{ inputs.flavor }}"
          FLAVOR="${FLAVOR:-oss}"
          if [ "$FLAVOR" = "preview" ]; then
            TASK="assemblePreviewRelease"
          else
            TASK="assembleOssRelease"
          fi
          echo "Running ./gradlew app:${TASK}..."
          ./gradlew "app:${TASK}"

      - name: Verify APK Signatures
        run: |
          echo "=== Verifying APK Signatures & Printing Certificate Fingerprints ==="
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: ${APKSIGNER}"
          find app/build/outputs/apk -name "*.apk" | while read -r apk; do
            echo "----------------------------------------"
            echo "Checking: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" || true
          done

      - name: Categorize APKs by Architecture
        run: |
          mkdir -p dist/arm64-v8a dist/armeabi-v7a dist/x86_64 dist/x86 dist/universal
          find app/build/outputs/apk -name "*arm64-v8a*.apk" -exec cp {} dist/arm64-v8a/ \;
          find app/build/outputs/apk -name "*armeabi-v7a*.apk" -exec cp {} dist/armeabi-v7a/ \;
          find app/build/outputs/apk -name "*x86_64*.apk" -exec cp {} dist/x86_64/ \;
          find app/build/outputs/apk -name "*x86*.apk" ! -name "*x86_64*.apk" -exec cp {} dist/x86/ \;
          find app/build/outputs/apk -name "*universal*.apk" -exec cp {} dist/universal/ \;
          echo "=== Categorized APKs ==="
          ls -R dist/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-arm64-v8a
          path: dist/arm64-v8a/*.apk
          if-no-files-found: ignore

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-armeabi-v7a
          path: dist/armeabi-v7a/*.apk
          if-no-files-found: ignore

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-x86_64
          path: dist/x86_64/*.apk
          if-no-files-found: ignore

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-x86
          path: dist/x86/*.apk
          if-no-files-found: ignore

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-universal
          path: dist/universal/*.apk
          if-no-files-found: ignore

      - name: Upload Keystore Artifact
        if: always() && steps.keystore.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.save_keystore != false)
        uses: actions/upload-artifact@v4
        with:
          name: TsukimiBox-Signing-Keystore
          path: keystore_backup/
